app = "vless-node"
primary_region = "sin"        # sin/sjc/nrt/hkg 等，按需改
kill_signal = "SIGINT"
kill_timeout = 5

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  UUID = "e974e5e0-fd9e-41de-8ce0-238ad038f222"
  WS_PATH = "/86e7d17b"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
