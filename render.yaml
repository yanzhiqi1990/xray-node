# Render Blueprint —— 免费 Web Service（Docker）
# Render 会自动注入 PORT 环境变量；容器内 entrypoint 读取 $PORT 监听
services:
  - type: web
    name: vless-node
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    envVars:
      - key: UUID
        value: e974e5e0-fd9e-41de-8ce0-238ad038f222
      - key: WS_PATH
        value: /86e7d17b
